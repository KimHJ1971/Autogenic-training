<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Aura Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#circleGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.6" />
  
  <!-- Ambient Glow -->
  <circle cx="256" cy="240" r="130" fill="url(#moonGlow)" />

  <!-- Calming Ripple Rings (Breath) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
  <circle cx="256" cy="256" r="105" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5" />
  <circle cx="256" cy="256" r="70" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.7" />

  <!-- Golden Moon & Peaceful Lotus/Body Silhouette -->
  <!-- Moon Crescent -->
  <path d="M256,150 C290,150 320,170 334,200 C310,195 280,205 264,228 C248,251 250,282 268,302 C240,300 216,280 206,252 C194,218 214,170 256,150 Z" 
        fill="#fef08a" opacity="0.9" filter="url(#glow)" />

  <!-- Gentle Pulse Wave at bottom -->
  <path d="M140,350 Q190,320 256,350 T372,350" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M170,375 Q210,355 256,375 T342,375" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Tiny Stars -->
  <circle cx="160" cy="180" r="2.5" fill="#f8fafc" opacity="0.8" />
  <circle cx="350" cy="160" r="2" fill="#f8fafc" opacity="0.7" />
  <circle cx="360" cy="280" r="3" fill="#fef08a" opacity="0.9" />
  <circle cx="150" cy="290" r="2" fill="#38bdf8" opacity="0.7" />
</svg>
